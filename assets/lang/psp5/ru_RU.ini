Which console button each of the PSP's is on. = На какой кнопке консоли находится каждая кнопка PSP.
Puts all twelve back where they started. = Возвращает все двенадцать на исходные места.
Press the console button you want it on. Waiting = Нажмите кнопку консоли, на которую хотите её назначить. Ожидание
