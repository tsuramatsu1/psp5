Closes PSP5 and returns to the console. = Закрывает PSP5 и возвращает к консоли.
Signs in so games award achievements as you play. = Выполняет вход, чтобы игры выдавали достижения во время игры.
Keeps a separate set of settings for this game. = Хранит отдельный набор настроек для этой игры.
