# psp5's own words in Russian.
#
# MACHINE TRANSLATED AND, FOR MOST LANGUAGES, UNREVIEWED. See the note in
# tools/make-strings.py. Corrections are welcome: edit this file or the table
# in that script, and the next build picks them up.
#
# `English = translation`, one per line. A missing line falls back to English.

Favorites = Избранное
Favorite = В избранное
A-Z = А-Я
Added = Добавлено
Not played yet = Ещё не играли
Import from cheat.db = Импорт из cheat.db
No cheat file for this game = Для этой игры нет файла читов
Slot = Слот
Save to this slot = Сохранить в этот слот
Load from this slot = Загрузить из этого слота
Exit game = Выйти из игры
empty = пусто
Change = Изменить
Close = Закрыть
Toggle = Переключить
Save and close = Сохранить и закрыть
Reset the buttons = Сбросить кнопки
USB controllers = USB-контроллеры
Changed = Изменено
Default = По умолчанию
Crop to 16:9 = Обрезать до 16:9
How much sharper than a PSP the picture is drawn. = Насколько чётче, чем на PSP, рисуется картинка.
Nearest keeps the original pixels; linear smooths them. = Ближайший сохраняет исходные пиксели, линейный их сглаживает.
Draws the frame rate over the game. = Рисует частоту кадров поверх игры.
Audio from the emulator. = Звук из эмулятора.
0 to 100, in steps of five. = От 0 до 100, шагом по пять.
Which button on the controller the PSP's is on. = На какой кнопке контроллера находится кнопка PSP.
Puts all eight back where they started. = Возвращает все восемь на исходные места.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = Контроллеры, которые консоль не подключает: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = USB-контроллер не найден. DualSense здесь ничего не требует.
Sharpens textures seen at a steep angle, like roads and floors. = Делает чётче текстуры под острым углом: дороги, полы.
Redraws the game's textures larger, on the CPU. Costly. = Перерисовывает текстуры крупнее на процессоре. Дорого.
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ сохраняет чёткие края, бикубический мягче и дешевле.
Smooths the banding upscaling can leave in a gradient. = Сглаживает полосы, которые масштабирование оставляет в градиенте.
Softens jagged edges. Off when buffer effects are skipped. = Сглаживает зубчатые края. Выключено при пропуске буферных эффектов.
Leaves flat 2D art alone so menus and text stay sharp. = Не трогает плоскую 2D-графику, чтобы меню и текст были чёткими.
Trims a sliver off the top and bottom to fill a widescreen. = Срезает полоску сверху и снизу, чтобы заполнить широкий экран.
On removes tearing; off lets frames arrive as soon as they are drawn. = Вкл убирает разрывы, выкл выдаёт кадры сразу после отрисовки.
Drops frames to keep a heavy game at speed. Off looks best. = Пропускает кадры, чтобы держать скорость. Выкл выглядит лучше всего.
Transforms geometry on the GPU. Off is slower and more accurate. = Преобразует геометрию на видеокарте. Выкл медленнее и точнее.
Animates characters on the CPU. Faster in most games. = Анимирует персонажей на процессоре. В большинстве игр быстрее.
Rechecks textures less often. Faster, and wrong in a few games. = Реже перепроверяет текстуры. Быстрее, но в паре игр неверно.
Much faster, and drops the effects some games draw off-screen. = Намного быстрее, но теряет эффекты, которые игры рисуют за кадром.
The home screen's own sounds. A game's music is separate. = Собственные звуки домашнего экрана. Музыка игры отдельно.
What a game is told the console's language is, and PPSSPP's own text. = Язык, который сообщается игре, и собственный текст PPSSPP.
How fast the game runs while the right trigger is held. = Скорость игры, пока удерживается правый триггер.
On earns hardcore unlocks but turns off save states entirely. = Вкл даёт хардкорные достижения, но полностью отключает быстрые сохранения.
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = Использует пакет из PSP/TEXTURES/<GAMEID>/, если он есть у игры.
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = Пишет нарисованное игрой в PSP/TEXTURES/<GAMEID>/new/, чтобы собрать пакет.
