# psp5's own words in Vietnamese.
#
# MACHINE TRANSLATED AND, FOR MOST LANGUAGES, UNREVIEWED. See the note in
# tools/make-strings.py. Corrections are welcome: edit this file or the table
# in that script, and the next build picks them up.
#
# `English = translation`, one per line. A missing line falls back to English.

Favorites = Yêu thích
Favorite = Yêu thích
Added = Đã thêm
Not played yet = Chưa chơi
Import from cheat.db = Nhập từ cheat.db
No cheat file for this game = Không có tệp cheat cho trò chơi này
Slot = Ô
Save to this slot = Lưu vào ô này
Load from this slot = Tải từ ô này
Exit game = Thoát trò chơi
empty = trống
Change = Thay đổi
Close = Đóng
Toggle = Bật/tắt
Save and close = Lưu và đóng
Reset the buttons = Đặt lại các nút
USB controllers = Tay cầm USB
Changed = Đã thay đổi
Default = Mặc định
Crop to 16:9 = Cắt thành 16:9
How much sharper than a PSP the picture is drawn. = Hình ảnh được vẽ sắc nét hơn PSP bao nhiêu.
Nearest keeps the original pixels; linear smooths them. = Gần nhất giữ nguyên điểm ảnh gốc; tuyến tính làm mượt chúng.
Draws the frame rate over the game. = Vẽ tốc độ khung hình lên trên trò chơi.
Audio from the emulator. = Âm thanh từ trình giả lập.
0 to 100, in steps of five. = Từ 0 đến 100, mỗi bước năm.
Which button on the controller the PSP's is on. = Nút của PSP nằm ở nút nào trên tay cầm.
Puts all eight back where they started. = Đưa cả tám nút về vị trí ban đầu.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = Tay cầm máy không ghép đôi: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = Không tìm thấy tay cầm USB. DualSense không cần gì ở đây.
Sharpens textures seen at a steep angle, like roads and floors. = Làm sắc nét kết cấu nhìn nghiêng, như đường và sàn.
Redraws the game's textures larger, on the CPU. Costly. = Vẽ lại kết cấu lớn hơn bằng CPU. Tốn kém.
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ giữ cạnh sắc; bicubic mềm hơn và nhẹ hơn.
Smooths the banding upscaling can leave in a gradient. = Làm mượt dải màu mà việc phóng to để lại trên vùng chuyển.
Softens jagged edges. Off when buffer effects are skipped. = Làm mềm cạnh răng cưa. Tắt khi bỏ qua hiệu ứng bộ đệm.
Leaves flat 2D art alone so menus and text stay sharp. = Giữ nguyên hình 2D phẳng để menu và chữ luôn sắc nét.
Trims a sliver off the top and bottom to fill a widescreen. = Cắt một dải trên và dưới để lấp đầy màn hình rộng.
On removes tearing; off lets frames arrive as soon as they are drawn. = Bật loại bỏ xé hình; tắt cho khung hình xuất ngay khi vẽ xong.
Drops frames to keep a heavy game at speed. Off looks best. = Bỏ khung hình để giữ tốc độ cho game nặng. Tắt là đẹp nhất.
Transforms geometry on the GPU. Off is slower and more accurate. = Biến đổi hình học trên GPU. Tắt thì chậm hơn nhưng chính xác hơn.
Animates characters on the CPU. Faster in most games. = Hoạt họa nhân vật bằng CPU. Nhanh hơn trong hầu hết trò chơi.
Rechecks textures less often. Faster, and wrong in a few games. = Kiểm tra lại kết cấu ít hơn. Nhanh hơn, và sai ở vài trò chơi.
Much faster, and drops the effects some games draw off-screen. = Nhanh hơn nhiều, nhưng mất hiệu ứng vài game vẽ ngoài màn hình.
The home screen's own sounds. A game's music is separate. = Âm thanh của màn hình chính. Nhạc trò chơi là riêng.
What a game is told the console's language is, and PPSSPP's own text. = Ngôn ngữ báo cho trò chơi, và văn bản của chính PPSSPP.
How fast the game runs while the right trigger is held. = Tốc độ trò chơi khi giữ cò phải.
On earns hardcore unlocks but turns off save states entirely. = Bật sẽ nhận thành tích hardcore nhưng tắt hẳn lưu trạng thái.
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = Dùng gói trong PSP/TEXTURES/<GAMEID>/ nếu trò chơi có.
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = Ghi những gì trò chơi vẽ vào PSP/TEXTURES/<GAMEID>/new/ để tạo gói.
