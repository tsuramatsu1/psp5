How much sharper than a PSP the picture is drawn. = Cuánto más nítida que en una PSP se dibuja la imagen.
Nearest keeps the original pixels; linear smooths them. = Vecino mantiene los píxeles originales; lineal los suaviza.
Draws the frame rate over the game. = Dibuja la tasa de fotogramas sobre el juego.
Audio from the emulator. = Sonido del emulador.
0 to 100, in steps of five. = De 0 a 100, en pasos de cinco.
Which button on the controller the PSP's is on. = En qué botón del mando está el de la PSP.
Puts all eight back where they started. = Devuelve los ocho a donde estaban.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = Mandos que la consola no vincula: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = No se ha encontrado ningún mando USB. Un DualSense no necesita nada aquí.
Sharpens textures seen at a steep angle, like roads and floors. = Afina las texturas vistas en ángulo, como carreteras y suelos.
Redraws the game's textures larger, on the CPU. Costly. = Redibuja las texturas más grandes, en la CPU. Costoso.
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ mantiene los bordes nítidos; bicúbico es más suave y barato.
Smooths the banding upscaling can leave in a gradient. = Suaviza las bandas que el escalado deja en un degradado.
Softens jagged edges. Off when buffer effects are skipped. = Suaviza los bordes dentados. Off si se omiten los efectos de búfer.
Leaves flat 2D art alone so menus and text stay sharp. = Deja intacto el arte 2D para que menús y texto sigan nítidos.
Trims a sliver off the top and bottom to fill a widescreen. = Recorta una franja arriba y abajo para llenar una pantalla panorámica.
On removes tearing; off lets frames arrive as soon as they are drawn. = Activado elimina el desgarro; desactivado entrega los fotogramas al dibujarse.
Drops frames to keep a heavy game at speed. Off looks best. = Descarta fotogramas para mantener la velocidad. Off se ve mejor.
Transforms geometry on the GPU. Off is slower and more accurate. = Transforma la geometría en la GPU. Off es más lento y más preciso.
Animates characters on the CPU. Faster in most games. = Anima los personajes en la CPU. Más rápido en la mayoría de juegos.
Rechecks textures less often. Faster, and wrong in a few games. = Revisa las texturas con menos frecuencia. Más rápido, y erróneo en algunos juegos.
Much faster, and drops the effects some games draw off-screen. = Mucho más rápido, y pierde los efectos que algunos juegos dibujan fuera de pantalla.
The home screen's own sounds. A game's music is separate. = Los sonidos de la pantalla de inicio. La música del juego va aparte.
What a game is told the console's language is, and PPSSPP's own text. = El idioma que se comunica al juego, y el texto propio de PPSSPP.
How fast the game runs while the right trigger is held. = A qué velocidad corre el juego mientras se mantiene el gatillo derecho.
On earns hardcore unlocks but turns off save states entirely. = Activado otorga logros hardcore, pero desactiva por completo los estados guardados.
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = Usa un paquete de PSP/TEXTURES/<GAMEID>/ si el juego tiene uno.
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = Escribe lo que dibuja el juego en PSP/TEXTURES/<GAMEID>/new/ para crear un paquete.
