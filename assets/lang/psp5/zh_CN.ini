# psp5's own words in Chinese (Simplified).
#
# MACHINE TRANSLATED AND, FOR MOST LANGUAGES, UNREVIEWED. See the note in
# tools/make-strings.py. Corrections are welcome: edit this file or the table
# in that script, and the next build picks them up.
#
# `English = translation`, one per line. A missing line falls back to English.

Favorites = 收藏
Favorite = 收藏
Added = 添加于
Not played yet = 尚未游玩
Import from cheat.db = 从 cheat.db 导入
No cheat file for this game = 此游戏没有金手指文件
Slot = 存档位
Save to this slot = 保存到此存档位
Load from this slot = 从此存档位读取
Exit game = 退出游戏
empty = 空
Change = 更改
Close = 关闭
Toggle = 切换
Save and close = 保存并关闭
Reset the buttons = 重置按键
USB controllers = USB 手柄
Changed = 已更改
Default = 默认
Crop to 16:9 = 裁剪为 16:9
How much sharper than a PSP the picture is drawn. = 画面比 PSP 清晰多少。
Nearest keeps the original pixels; linear smooths them. = 邻近保留原始像素，线性则将其平滑。
Draws the frame rate over the game. = 在游戏画面上绘制帧率。
Audio from the emulator. = 来自模拟器的声音。
0 to 100, in steps of five. = 0 到 100，每次 5。
Which button on the controller the PSP's is on. = PSP 的按键对应手柄上的哪个键。
Puts all eight back where they started. = 将八个按键全部恢复原位。
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = 主机不会配对的手柄：Xbox 360、PS3、DualShock 3。
No USB controller found. A DualSense needs nothing here. = 未找到 USB 手柄。DualSense 无需在此设置。
Sharpens textures seen at a steep angle, like roads and floors. = 锐化以斜角看到的纹理，例如道路和地面。
Redraws the game's textures larger, on the CPU. Costly. = 在 CPU 上将纹理重绘得更大。开销较高。
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ 保持边缘锐利；双三次更柔和也更省。
Smooths the banding upscaling can leave in a gradient. = 平滑放大在渐变中留下的色带。
Softens jagged edges. Off when buffer effects are skipped. = 柔化锯齿边缘。跳过缓冲特效时无效。
Leaves flat 2D art alone so menus and text stay sharp. = 保留平面 2D 图像，使菜单和文字保持清晰。
Trims a sliver off the top and bottom to fill a widescreen. = 裁去上下少许以填满宽屏。
On removes tearing; off lets frames arrive as soon as they are drawn. = 开启可消除撕裂；关闭则画面绘制完即刻输出。
Drops frames to keep a heavy game at speed. Off looks best. = 丢弃帧以维持重负载游戏的速度。关闭时画面最好。
Transforms geometry on the GPU. Off is slower and more accurate. = 在 GPU 上变换几何体。关闭较慢但更准确。
Animates characters on the CPU. Faster in most games. = 在 CPU 上处理角色动画。多数游戏更快。
Rechecks textures less often. Faster, and wrong in a few games. = 较少重新检查纹理。更快，但少数游戏会出错。
Much faster, and drops the effects some games draw off-screen. = 快得多，但会丢失部分游戏在屏幕外绘制的特效。
The home screen's own sounds. A game's music is separate. = 主屏幕自身的音效。游戏音乐与此无关。
What a game is told the console's language is, and PPSSPP's own text. = 告知游戏的主机语言，以及 PPSSPP 自身的文字。
How fast the game runs while the right trigger is held. = 按住右扳机时游戏的运行速度。
On earns hardcore unlocks but turns off save states entirely. = 开启可获得硬核成就，但会完全关闭即时存档。
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = 若游戏有，则使用 PSP/TEXTURES/<GAMEID>/ 中的材质包。
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = 将游戏绘制的内容写入 PSP/TEXTURES/<GAMEID>/new/ 以制作材质包。
