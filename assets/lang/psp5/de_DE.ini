# psp5's own words in German.
#
# MACHINE TRANSLATED AND, FOR MOST LANGUAGES, UNREVIEWED. See the note in
# tools/make-strings.py. Corrections are welcome: edit this file or the table
# in that script, and the next build picks them up.
#
# `English = translation`, one per line. A missing line falls back to English.

Favorites = Favoriten
Favorite = Favorit
Added = Hinzugefügt
Not played yet = Noch nicht gespielt
Import from cheat.db = Aus cheat.db importieren
No cheat file for this game = Keine Cheat-Datei für dieses Spiel
Slot = Speicherplatz
Save to this slot = In diesem Speicherplatz sichern
Load from this slot = Aus diesem Speicherplatz laden
Exit game = Spiel beenden
empty = leer
Change = Ändern
Close = Schließen
Toggle = Umschalten
Save and close = Speichern und schließen
Reset the buttons = Tasten zurücksetzen
USB controllers = USB-Controller
Changed = Geändert
Default = Standard
Crop to 16:9 = Auf 16:9 zuschneiden
How much sharper than a PSP the picture is drawn. = Wie viel schärfer als auf einer PSP das Bild gezeichnet wird.
Nearest keeps the original pixels; linear smooths them. = Nächster erhält die ursprünglichen Pixel, linear glättet sie.
Draws the frame rate over the game. = Zeichnet die Bildrate über das Spiel.
Audio from the emulator. = Ton vom Emulator.
0 to 100, in steps of five. = 0 bis 100, in Fünferschritten.
Which button on the controller the PSP's is on. = Auf welcher Controller-Taste die PSP-Taste liegt.
Puts all eight back where they started. = Setzt alle acht dorthin zurück, wo sie begonnen haben.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = Controller, die die Konsole nicht koppelt: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = Kein USB-Controller gefunden. Ein DualSense braucht hier nichts.
Sharpens textures seen at a steep angle, like roads and floors. = Schärft Texturen in flachem Blickwinkel, etwa Straßen und Böden.
Redraws the game's textures larger, on the CPU. Costly. = Zeichnet die Texturen auf der CPU größer neu. Teuer.
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ hält Kanten scharf, bikubisch ist weicher und günstiger.
Smooths the banding upscaling can leave in a gradient. = Glättet die Streifen, die das Hochskalieren in Verläufen hinterlässt.
Softens jagged edges. Off when buffer effects are skipped. = Glättet Treppenkanten. Aus, wenn Puffereffekte übersprungen werden.
Leaves flat 2D art alone so menus and text stay sharp. = Lässt flache 2D-Grafik unberührt, damit Menüs und Text scharf bleiben.
Trims a sliver off the top and bottom to fill a widescreen. = Schneidet oben und unten einen Streifen ab, um das Breitbild zu füllen.
On removes tearing; off lets frames arrive as soon as they are drawn. = An verhindert Tearing, aus liefert Bilder, sobald sie gezeichnet sind.
Drops frames to keep a heavy game at speed. Off looks best. = Lässt Bilder aus, damit ein schweres Spiel Tempo hält. Aus sieht am besten aus.
Transforms geometry on the GPU. Off is slower and more accurate. = Transformiert Geometrie auf der GPU. Aus ist langsamer und genauer.
Animates characters on the CPU. Faster in most games. = Animiert Figuren auf der CPU. In den meisten Spielen schneller.
Rechecks textures less often. Faster, and wrong in a few games. = Prüft Texturen seltener erneut. Schneller, in wenigen Spielen falsch.
Much faster, and drops the effects some games draw off-screen. = Deutlich schneller, lässt aber Effekte weg, die manche Spiele abseits zeichnen.
The home screen's own sounds. A game's music is separate. = Die Klänge des Startbildschirms. Die Musik eines Spiels ist davon getrennt.
What a game is told the console's language is, and PPSSPP's own text. = Die Sprache, die einem Spiel gemeldet wird, und PPSSPPs eigener Text.
How fast the game runs while the right trigger is held. = Wie schnell das Spiel läuft, solange der rechte Trigger gehalten wird.
On earns hardcore unlocks but turns off save states entirely. = An bringt Hardcore-Freischaltungen, schaltet Speicherstände aber ganz ab.
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = Nutzt ein Paket aus PSP/TEXTURES/<GAMEID>/, wenn ein Spiel eines hat.
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = Schreibt Gezeichnetes nach PSP/TEXTURES/<GAMEID>/new/, um ein Paket zu bauen.
