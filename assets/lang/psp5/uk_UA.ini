Save to this slot = Зберегти в цей слот
Load from this slot = Завантажити з цього слота
Exit game = Вийти з гри
empty = порожньо
Change = Змінити
Close = Закрити
Toggle = Перемкнути
Save and close = Зберегти і закрити
Reset the buttons = Скинути кнопки
USB controllers = USB-контролери
Changed = Змінено
Default = За умовчанням
Crop to 16:9 = Обрізати до 16:9
How much sharper than a PSP the picture is drawn. = Наскільки чіткіше, ніж на PSP, малюється зображення.
Nearest keeps the original pixels; linear smooths them. = Найближчий зберігає вихідні пікселі, лінійний їх згладжує.
Draws the frame rate over the game. = Малює частоту кадрів поверх гри.
Audio from the emulator. = Звук з емулятора.
0 to 100, in steps of five. = Від 0 до 100, кроком по п'ять.
Which button on the controller the PSP's is on. = На якій кнопці контролера розташована кнопка PSP.
Puts all eight back where they started. = Повертає всі вісім на початкові місця.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = Контролери, які консоль не підключає: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = USB-контролер не знайдено. DualSense тут нічого не потребує.
Sharpens textures seen at a steep angle, like roads and floors. = Робить чіткішими текстури під гострим кутом: дороги, підлоги.
Redraws the game's textures larger, on the CPU. Costly. = Перемальовує текстури більшими на процесорі. Дорого.
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ зберігає чіткі краї, бікубічний м'якший і дешевший.
Smooths the banding upscaling can leave in a gradient. = Згладжує смуги, які масштабування лишає в градієнті.
Softens jagged edges. Off when buffer effects are skipped. = Згладжує зубчасті краї. Вимкнено, якщо пропускати буферні ефекти.
Leaves flat 2D art alone so menus and text stay sharp. = Не чіпає пласку 2D-графіку, щоб меню й текст були чіткими.
Trims a sliver off the top and bottom to fill a widescreen. = Зрізає смужку згори й знизу, щоб заповнити широкий екран.
On removes tearing; off lets frames arrive as soon as they are drawn. = Увімкнено усуває розриви, вимкнено видає кадри одразу після малювання.
Drops frames to keep a heavy game at speed. Off looks best. = Пропускає кадри, щоб тримати швидкість. Вимкнено виглядає найкраще.
Transforms geometry on the GPU. Off is slower and more accurate. = Перетворює геометрію на відеокарті. Вимкнено повільніше й точніше.
Animates characters on the CPU. Faster in most games. = Анімує персонажів на процесорі. У більшості ігор швидше.
Rechecks textures less often. Faster, and wrong in a few games. = Рідше перевіряє текстури. Швидше, але в кількох іграх хибно.
Much faster, and drops the effects some games draw off-screen. = Значно швидше, але втрачає ефекти, які ігри малюють поза екраном.
The home screen's own sounds. A game's music is separate. = Власні звуки домашнього екрана. Музика гри окремо.
What a game is told the console's language is, and PPSSPP's own text. = Мова, яку повідомляють грі, і власний текст PPSSPP.
How fast the game runs while the right trigger is held. = Швидкість гри, поки утримується правий тригер.
On earns hardcore unlocks but turns off save states entirely. = Увімкнено дає хардкорні досягнення, але повністю вимикає швидкі збереження.
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = Використовує пакунок з PSP/TEXTURES/<GAMEID>/, якщо гра його має.
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = Записує намальоване грою в PSP/TEXTURES/<GAMEID>/new/, щоб зібрати пакунок.
