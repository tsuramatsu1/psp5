How much sharper than a PSP the picture is drawn. = À quel point l'image est plus nette que sur une PSP.
Nearest keeps the original pixels; linear smooths them. = Au plus proche garde les pixels d'origine, linéaire les lisse.
Draws the frame rate over the game. = Affiche le nombre d'images par seconde par-dessus le jeu.
Audio from the emulator. = Le son de l'émulateur.
0 to 100, in steps of five. = De 0 à 100, par pas de cinq.
Which button on the controller the PSP's is on. = Sur quel bouton de la manette se trouve celui de la PSP.
Puts all eight back where they started. = Remet les huit là où ils étaient.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = Manettes que la console n'appaire pas : Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = Aucune manette USB trouvée. Une DualSense n'a rien à faire ici.
Sharpens textures seen at a steep angle, like roads and floors. = Affine les textures vues de biais, comme les routes et les sols.
Redraws the game's textures larger, on the CPU. Costly. = Redessine les textures en plus grand, sur le processeur. Coûteux.
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ garde des bords nets, bicubique est plus doux et moins coûteux.
Smooths the banding upscaling can leave in a gradient. = Lisse les bandes que l'agrandissement laisse dans un dégradé.
Softens jagged edges. Off when buffer effects are skipped. = Adoucit les bords crénelés. Inactif si les effets de tampon sont ignorés.
Leaves flat 2D art alone so menus and text stay sharp. = Laisse les éléments 2D intacts pour garder menus et texte nets.
Trims a sliver off the top and bottom to fill a widescreen. = Rogne une bande en haut et en bas pour remplir un écran large.
On removes tearing; off lets frames arrive as soon as they are drawn. = Activé supprime le déchirement, désactivé envoie les images dès qu'elles sont prêtes.
Drops frames to keep a heavy game at speed. Off looks best. = Saute des images pour tenir la vitesse. Désactivé est le plus beau.
Transforms geometry on the GPU. Off is slower and more accurate. = Transforme la géométrie sur le GPU. Désactivé est plus lent et plus exact.
Animates characters on the CPU. Faster in most games. = Anime les personnages sur le processeur. Plus rapide dans la plupart des jeux.
Rechecks textures less often. Faster, and wrong in a few games. = Revérifie les textures moins souvent. Plus rapide, et faux dans quelques jeux.
Much faster, and drops the effects some games draw off-screen. = Bien plus rapide, mais supprime les effets dessinés hors écran par certains jeux.
The home screen's own sounds. A game's music is separate. = Les sons de l'écran d'accueil. La musique d'un jeu est à part.
What a game is told the console's language is, and PPSSPP's own text. = La langue annoncée au jeu, et le texte de PPSSPP lui-même.
How fast the game runs while the right trigger is held. = La vitesse du jeu tant que la gâchette droite est maintenue.
On earns hardcore unlocks but turns off save states entirely. = Activé donne les succès hardcore mais supprime toute sauvegarde d'état.
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = Utilise un pack dans PSP/TEXTURES/<GAMEID>/ si le jeu en a un.
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = Écrit ce que le jeu dessine dans PSP/TEXTURES/<GAMEID>/new/ pour créer un pack.
