Load from this slot = تحميل من هذه الخانة
Exit game = إنهاء اللعبة
empty = فارغ
Change = تغيير
Close = إغلاق
Toggle = تبديل
Save and close = حفظ وإغلاق
Reset the buttons = إعادة تعيين الأزرار
USB controllers = وحدات تحكم USB
Changed = تم التغيير
Default = الافتراضي
Crop to 16:9 = اقتصاص إلى 16:9
How much sharper than a PSP the picture is drawn. = مدى حدة الصورة مقارنة بجهاز PSP.
Nearest keeps the original pixels; linear smooths them. = الأقرب يحافظ على البكسلات الأصلية؛ الخطي ينعّمها.
Draws the frame rate over the game. = يرسم معدل الإطارات فوق اللعبة.
Audio from the emulator. = الصوت من المحاكي.
0 to 100, in steps of five. = من 0 إلى 100، بخطوات من خمسة.
Which button on the controller the PSP's is on. = أي زر في وحدة التحكم يقابل زر PSP.
Puts all eight back where they started. = يعيد الأزرار الثمانية إلى مواضعها الأصلية.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = وحدات التحكم التي لا يقترن بها الجهاز: Xbox 360 وPS3 وDualShock 3.
No USB controller found. A DualSense needs nothing here. = لم يتم العثور على وحدة تحكم USB. لا تحتاج DualSense إلى شيء هنا.
