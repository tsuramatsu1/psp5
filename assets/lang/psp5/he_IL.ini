# psp5's own words in Hebrew.
#
# MACHINE TRANSLATED AND, FOR MOST LANGUAGES, UNREVIEWED. See the note in
# tools/make-strings.py. Corrections are welcome: edit this file or the table
# in that script, and the next build picks them up.
#
# `English = translation`, one per line. A missing line falls back to English.

Favorites = מועדפים
Favorite = מועדף
A-Z = א-ת
Added = נוסף
Not played yet = טרם שוחק
Import from cheat.db = ייבוא מ-cheat.db
No cheat file for this game = אין קובץ צ'יטים למשחק זה
Slot = משבצת
Save to this slot = שמירה במשבצת זו
Load from this slot = טעינה ממשבצת זו
Exit game = יציאה מהמשחק
empty = ריקה
Change = שינוי
Close = סגירה
Toggle = החלפה
Save and close = שמירה וסגירה
Reset the buttons = איפוס הכפתורים
USB controllers = בקרי USB
Changed = שונה
Default = ברירת מחדל
Crop to 16:9 = חיתוך ל-16:9
How much sharper than a PSP the picture is drawn. = עד כמה התמונה חדה יותר מ-PSP.
Nearest keeps the original pixels; linear smooths them. = הקרוב ביותר שומר על הפיקסלים המקוריים; ליניארי מחליק אותם.
Draws the frame rate over the game. = מצייר את קצב הפריימים מעל המשחק.
Audio from the emulator. = שמע מהאמולטור.
0 to 100, in steps of five. = מ-0 עד 100, בקפיצות של חמש.
Which button on the controller the PSP's is on. = על איזה כפתור בבקר נמצא הכפתור של ה-PSP.
Puts all eight back where they started. = מחזיר את כל השמונה למקומם המקורי.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = בקרים שהקונסולה לא מצמידה: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = לא נמצא בקר USB. ל-DualSense אין צורך בכלום כאן.
MENU = תפריט
CHEATS = צ'יטים
SAVE STATE = שמירת מצב
ACHIEVEMENTS = הישגים
ALL = הכול
LOCKED = נעולים
UNLOCKED = נפתחו
CLOSE = סגירה
BACK = חזרה
none = אין
hardcore = הארדקור
No games yet = אין עדיין משחקים
