Press Triangle on a game to keep it here. = לחץ משולש על משחק כדי לשמור אותו כאן.
Closes PSP5 and returns to the console. = סוגר את PSP5 וחוזר לקונסולה.
Signs in so games award achievements as you play. = מתחבר כדי שמשחקים יעניקו הישגים תוך כדי משחק.
Keeps a separate set of settings for this game. = שומר ערכת הגדרות נפרדת למשחק זה.
