Crop to 16:9 = 16:9'a kırp
How much sharper than a PSP the picture is drawn. = Görüntünün bir PSP'den ne kadar keskin çizileceği.
Nearest keeps the original pixels; linear smooths them. = En yakın özgün pikselleri korur; doğrusal onları yumuşatır.
Draws the frame rate over the game. = Kare hızını oyunun üzerine çizer.
Audio from the emulator. = Öykünücüden gelen ses.
0 to 100, in steps of five. = 0 ile 100 arası, beşer beşer.
Which button on the controller the PSP's is on. = PSP'nin düğmesinin kumandadaki yeri.
Puts all eight back where they started. = Sekizini de başladıkları yere döndürür.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = Konsolun eşleştirmediği kumandalar: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = USB kumanda bulunamadı. DualSense için burada bir şey gerekmez.
Sharpens textures seen at a steep angle, like roads and floors. = Yol ve zemin gibi dar açıyla görünen dokuları keskinleştirir.
Redraws the game's textures larger, on the CPU. Costly. = Dokuları işlemcide daha büyük çizer. Maliyetli.
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ kenarları keskin tutar; bikübik daha yumuşak ve ucuzdur.
Smooths the banding upscaling can leave in a gradient. = Ölçeklemenin geçişlerde bıraktığı bantlanmayı yumuşatır.
Softens jagged edges. Off when buffer effects are skipped. = Tırtıklı kenarları yumuşatır. Arabellek efektleri atlanırsa kapalıdır.
Leaves flat 2D art alone so menus and text stay sharp. = Düz 2B görselleri bırakır, menüler ve yazılar keskin kalır.
Trims a sliver off the top and bottom to fill a widescreen. = Geniş ekranı doldurmak için üstten ve alttan ince bir şerit keser.
On removes tearing; off lets frames arrive as soon as they are drawn. = Açık yırtılmayı giderir; kapalı kareleri çizilir çizilmez gönderir.
Drops frames to keep a heavy game at speed. Off looks best. = Ağır oyunu hızda tutmak için kare atlar. Kapalı en iyi görünür.
Transforms geometry on the GPU. Off is slower and more accurate. = Geometriyi GPU'da dönüştürür. Kapalı daha yavaş ve daha doğrudur.
Animates characters on the CPU. Faster in most games. = Karakterleri işlemcide canlandırır. Çoğu oyunda daha hızlıdır.
Rechecks textures less often. Faster, and wrong in a few games. = Dokuları daha seyrek denetler. Daha hızlı, birkaç oyunda hatalı.
Much faster, and drops the effects some games draw off-screen. = Çok daha hızlı, ancak bazı oyunların ekran dışında çizdiği efektleri atar.
The home screen's own sounds. A game's music is separate. = Ana ekranın kendi sesleri. Oyun müziği ayrıdır.
What a game is told the console's language is, and PPSSPP's own text. = Oyuna bildirilen konsol dili ve PPSSPP'nin kendi metni.
How fast the game runs while the right trigger is held. = Sağ tetik basılıyken oyunun çalışma hızı.
On earns hardcore unlocks but turns off save states entirely. = Açık hardcore başarımlar kazandırır ama durum kayıtlarını tümüyle kapatır.
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = Oyunun varsa PSP/TEXTURES/<GAMEID>/ içindeki paketi kullanır.
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = Oyunun çizdiklerini paket oluşturmak için PSP/TEXTURES/<GAMEID>/new/ içine yazar.
