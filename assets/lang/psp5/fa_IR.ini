Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = دسته‌هایی که کنسول جفت نمی‌کند: Xbox 360، PS3، DualShock 3.
No USB controller found. A DualSense needs nothing here. = دسته USB پیدا نشد. DualSense به چیزی در اینجا نیاز ندارد.
