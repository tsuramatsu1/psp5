Nearest keeps the original pixels; linear smooths them. = نزدیک‌ترین پیکسل‌های اصلی را نگه می‌دارد؛ خطی آنها را نرم می‌کند.
Draws the frame rate over the game. = نرخ فریم را روی بازی می‌کشد.
Audio from the emulator. = صدا از شبیه‌ساز.
0 to 100, in steps of five. = از ۰ تا ۱۰۰، با گام‌های پنج‌تایی.
