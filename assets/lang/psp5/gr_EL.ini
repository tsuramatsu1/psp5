How much sharper than a PSP the picture is drawn. = Πόσο πιο ευκρινής από μια PSP σχεδιάζεται η εικόνα.
Nearest keeps the original pixels; linear smooths them. = Το πλησιέστερο κρατά τα αρχικά εικονοστοιχεία, το γραμμικό τα εξομαλύνει.
Draws the frame rate over the game. = Σχεδιάζει τον ρυθμό καρέ πάνω από το παιχνίδι.
Audio from the emulator. = Ήχος από τον εξομοιωτή.
0 to 100, in steps of five. = Από 0 έως 100, ανά πέντε.
Which button on the controller the PSP's is on. = Σε ποιο κουμπί του χειριστηρίου βρίσκεται αυτό του PSP.
Puts all eight back where they started. = Επαναφέρει και τα οκτώ εκεί που ξεκίνησαν.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = Χειριστήρια που δεν συνδέει η κονσόλα: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = Δεν βρέθηκε χειριστήριο USB. Το DualSense δεν χρειάζεται κάτι εδώ.
