How much sharper than a PSP the picture is drawn. = Hur mycket skarpare bilden ritas än på en PSP.
Nearest keeps the original pixels; linear smooths them. = Närmaste behåller originalpixlarna; linjär jämnar ut dem.
Draws the frame rate over the game. = Ritar bildfrekvensen över spelet.
Audio from the emulator. = Ljud från emulatorn.
0 to 100, in steps of five. = 0 till 100, i steg om fem.
Which button on the controller the PSP's is on. = Vilken knapp på handkontrollen PSP-knappen är kopplad till.
Puts all eight back where they started. = Sätter tillbaka alla åtta där de började.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = Handkontroller som konsolen inte kan parkoppla: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = Ingen USB-handkontroll hittades. En DualSense behöver inget här.
Sharpens textures seen at a steep angle, like roads and floors. = Gör texturer som ses i låg vinkel skarpare, till exempel vägar och golv.
Redraws the game's textures larger, on the CPU. Costly. = Ritar om spelets texturer större på processorn. Resurskrävande.
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ behåller skarpa kanter; bikubisk filtrering är mjukare och mindre resurskrävande.
Smooths the banding upscaling can leave in a gradient. = Jämnar ut bandning som uppskalning kan lämna i en toning.
Softens jagged edges. Off when buffer effects are skipped. = Mjukar upp ojämna kanter. Av när buffereffekter hoppas över.
Leaves flat 2D art alone so menus and text stay sharp. = Låter platt 2D-grafik vara så att menyer och text förblir skarpa.
Trims a sliver off the top and bottom to fill a widescreen. = Beskär lite upptill och nedtill för att fylla en bredbildsskärm.
On removes tearing; off lets frames arrive as soon as they are drawn. = På tar bort bildrivning; av visar bildrutor så snart de har ritats.
Drops frames to keep a heavy game at speed. Off looks best. = Hoppar över bildrutor för att tunga spel ska hålla hastigheten. Av ser bäst ut.
Transforms geometry on the GPU. Off is slower and more accurate. = Omvandlar geometri på GPU:n. Av är långsammare men mer exakt.
Animates characters on the CPU. Faster in most games. = Animerar figurer på processorn. Snabbare i de flesta spel.
Rechecks textures less often. Faster, and wrong in a few games. = Kontrollerar texturer mer sällan. Snabbare, men fel i några spel.
Much faster, and drops the effects some games draw off-screen. = Mycket snabbare, men utelämnar effekter som vissa spel ritar utanför skärmen.
The home screen's own sounds. A game's music is separate. = Startskärmens egna ljud. Ett spels musik är separat.
What a game is told the console's language is, and PPSSPP's own text. = Språket som spelet får veta att konsolen använder, och PPSSPP:s egen text.
How fast the game runs while the right trigger is held. = Hur snabbt spelet körs när höger avtryckare hålls ned.
On earns hardcore unlocks but turns off save states entirely. = På ger hardcore-prestationer men stänger helt av sparade lägen.
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = Använder ett paket från PSP/TEXTURES/<GAMEID>/ om spelet har ett.
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = Skriver det spelet ritar till PSP/TEXTURES/<GAMEID>/new/ för att skapa ett paket.
