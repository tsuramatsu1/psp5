# psp5's own words in Lao.
#
# MACHINE TRANSLATED AND, FOR MOST LANGUAGES, UNREVIEWED. See the note in
# tools/make-strings.py. Corrections are welcome: edit this file or the table
# in that script, and the next build picks them up.
#
# `English = translation`, one per line. A missing line falls back to English.

Favorites = ລາຍການທີ່ມັກ
Favorite = ທີ່ມັກ
Added = ເພີ່ມເມື່ອ
Not played yet = ຍັງບໍ່ໄດ້ຫຼິ້ນ
Import from cheat.db = ນຳເຂົ້າຈາກ cheat.db
No cheat file for this game = ບໍ່ມີໄຟລ໌ໂກງສຳລັບເກມນີ້
Slot = ຊ່ອງ
Save to this slot = ບັນທຶກໃສ່ຊ່ອງນີ້
Load from this slot = ໂຫຼດຈາກຊ່ອງນີ້
Exit game = ອອກຈາກເກມ
empty = ວ່າງ
Change = ປ່ຽນ
Close = ປິດ
Toggle = ສະຫຼັບ
Save and close = ບັນທຶກແລ້ວປິດ
Reset the buttons = ຕັ້ງປຸ່ມຄືນໃໝ່
USB controllers = ຕົວຄວບຄຸມ USB
Changed = ປ່ຽນແລ້ວ
Default = ຄ່າເລີ່ມຕົ້ນ
Crop to 16:9 = ຕັດເປັນ 16:9
How much sharper than a PSP the picture is drawn. = ພາບຖືກແຕ້ມຄົມກວ່າ PSP ຫຼາຍປານໃດ.
Nearest keeps the original pixels; linear smooths them. = ໃກ້ສຸດຮັກສາພິກເຊວເດີມ; ເສັ້ນຊື່ເຮັດໃຫ້ລຽບ.
Draws the frame rate over the game. = ແຕ້ມອັດຕາເຟຣມເທິງເກມ.
Audio from the emulator. = ສຽງຈາກຕົວຈຳລອງ.
0 to 100, in steps of five. = 0 ຫາ 100, ເທື່ອລະ 5.
Which button on the controller the PSP's is on. = ປຸ່ມ PSP ຢູ່ປຸ່ມໃດຂອງຕົວຄວບຄຸມ.
Puts all eight back where they started. = ເອົາທັງແປດກັບໄປບ່ອນເດີມ.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = ຕົວຄວບຄຸມທີ່ເຄື່ອງບໍ່ຈັບຄູ່: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = ບໍ່ພົບຕົວຄວບຄຸມ USB. DualSense ບໍ່ຕ້ອງການຫຍັງບ່ອນນີ້.
MENU = ເມນູ
CHEATS = ສູດໂກງ
SAVE STATE = ບັນທຶກສະຖານະ
ACHIEVEMENTS = ຜົນສຳເລັດ
ALL = ທັງໝົດ
LOCKED = ລັອກ
UNLOCKED = ປົດລັອກ
CLOSE = ປິດ
BACK = ກັບຄືນ
none = ບໍ່ມີ
No games yet = ຍັງບໍ່ມີເກມ
No favorites yet = ຍັງບໍ່ມີລາຍການທີ່ມັກ
Press Triangle on a game to keep it here. = ກົດສາມຫຼ່ຽມທີ່ເກມເພື່ອເກັບໄວ້ບ່ອນນີ້.
Closes PSP5 and returns to the console. = ປິດ PSP5 ແລ້ວກັບໄປເຄື່ອງ.
Signs in so games award achievements as you play. = ເຂົ້າສູ່ລະບົບເພື່ອໃຫ້ເກມມອບຜົນສຳເລັດຂະນະຫຼິ້ນ.
Keeps a separate set of settings for this game. = ເກັບຊຸດການຕັ້ງຄ່າແຍກສຳລັບເກມນີ້.
Not signed in = ຍັງບໍ່ໄດ້ເຂົ້າສູ່ລະບົບ
Buttons = ປຸ່ມ
CONTROLS = ການຄວບຄຸມ
BUTTON = ປຸ່ມ
SECOND BUTTON = ປຸ່ມທີສອງ
Set = ຕັ້ງ
Second button = ປຸ່ມທີສອງ
Clear the second = ລຶບອັນທີສອງ
Not set = ຍັງບໍ່ໄດ້ຕັ້ງ
