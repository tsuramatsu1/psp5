How much sharper than a PSP the picture is drawn. = Quanto più nitida di una PSP viene disegnata l'immagine.
Nearest keeps the original pixels; linear smooths them. = Più vicino mantiene i pixel originali, lineare li ammorbidisce.
Draws the frame rate over the game. = Disegna il frame rate sopra il gioco.
Audio from the emulator. = Audio dall'emulatore.
0 to 100, in steps of five. = Da 0 a 100, a passi di cinque.
Which button on the controller the PSP's is on. = Su quale tasto del controller si trova quello della PSP.
Puts all eight back where they started. = Riporta tutti e otto dov'erano.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = Controller che la console non associa: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = Nessun controller USB trovato. Un DualSense non serve qui.
Sharpens textures seen at a steep angle, like roads and floors. = Rende nitide le texture viste di scorcio, come strade e pavimenti.
Redraws the game's textures larger, on the CPU. Costly. = Ridisegna le texture più grandi, sulla CPU. Costoso.
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ mantiene i bordi netti, bicubico è più morbido e leggero.
Smooths the banding upscaling can leave in a gradient. = Attenua le bande che l'ingrandimento lascia in una sfumatura.
Softens jagged edges. Off when buffer effects are skipped. = Ammorbidisce i bordi seghettati. Off se si saltano gli effetti buffer.
Leaves flat 2D art alone so menus and text stay sharp. = Lascia intatta la grafica 2D, così menu e testo restano nitidi.
Trims a sliver off the top and bottom to fill a widescreen. = Taglia una striscia sopra e sotto per riempire il widescreen.
On removes tearing; off lets frames arrive as soon as they are drawn. = Attivo elimina il tearing, disattivo mostra i fotogrammi appena pronti.
Drops frames to keep a heavy game at speed. Off looks best. = Salta fotogrammi per tenere la velocità. Off è il più bello.
Transforms geometry on the GPU. Off is slower and more accurate. = Trasforma la geometria sulla GPU. Off è più lento e più preciso.
Animates characters on the CPU. Faster in most games. = Anima i personaggi sulla CPU. Più veloce nella maggior parte dei giochi.
Rechecks textures less often. Faster, and wrong in a few games. = Ricontrolla le texture meno spesso. Più veloce, errato in alcuni giochi.
Much faster, and drops the effects some games draw off-screen. = Molto più veloce, ma perde gli effetti che alcuni giochi disegnano fuori schermo.
The home screen's own sounds. A game's music is separate. = I suoni della schermata iniziale. La musica dei giochi è separata.
What a game is told the console's language is, and PPSSPP's own text. = La lingua comunicata al gioco e il testo di PPSSPP.
How fast the game runs while the right trigger is held. = La velocità del gioco mentre si tiene premuto il grilletto destro.
On earns hardcore unlocks but turns off save states entirely. = Attivo dà gli sblocchi hardcore ma disattiva del tutto i salvataggi di stato.
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = Usa un pacchetto da PSP/TEXTURES/<GAMEID>/ se il gioco ne ha uno.
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = Scrive ciò che il gioco disegna in PSP/TEXTURES/<GAMEID>/new/ per creare un pacchetto.
