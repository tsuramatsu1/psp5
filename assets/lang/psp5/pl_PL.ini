How much sharper than a PSP the picture is drawn. = O ile ostrzej niż na PSP rysowany jest obraz.
Nearest keeps the original pixels; linear smooths them. = Najbliższy zachowuje oryginalne piksele, liniowy je wygładza.
Draws the frame rate over the game. = Rysuje liczbę klatek na sekundę na grze.
Audio from the emulator. = Dźwięk z emulatora.
0 to 100, in steps of five. = Od 0 do 100, co pięć.
Which button on the controller the PSP's is on. = Na którym przycisku kontrolera znajduje się przycisk PSP.
Puts all eight back where they started. = Przywraca wszystkie osiem tam, gdzie były.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = Kontrolery, których konsola nie paruje: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = Nie znaleziono kontrolera USB. DualSense nic tu nie potrzebuje.
Sharpens textures seen at a steep angle, like roads and floors. = Wyostrza tekstury widziane pod kątem, jak drogi i podłogi.
Redraws the game's textures larger, on the CPU. Costly. = Rysuje tekstury w większym rozmiarze na CPU. Kosztowne.
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ zachowuje ostre krawędzie, bicubic jest łagodniejszy i tańszy.
Smooths the banding upscaling can leave in a gradient. = Wygładza pasy, które skalowanie zostawia w gradiencie.
Softens jagged edges. Off when buffer effects are skipped. = Wygładza postrzępione krawędzie. Wyłączone przy pominięciu efektów bufora.
Leaves flat 2D art alone so menus and text stay sharp. = Pozostawia płaską grafikę 2D, by menu i tekst były ostre.
Trims a sliver off the top and bottom to fill a widescreen. = Przycina pasek u góry i u dołu, by wypełnić ekran panoramiczny.
On removes tearing; off lets frames arrive as soon as they are drawn. = Włączone usuwa rozrywanie, wyłączone wysyła klatki zaraz po narysowaniu.
Drops frames to keep a heavy game at speed. Off looks best. = Pomija klatki, by utrzymać tempo wymagającej gry. Wyłączone wygląda najlepiej.
Transforms geometry on the GPU. Off is slower and more accurate. = Przekształca geometrię na GPU. Wyłączone jest wolniejsze i dokładniejsze.
Animates characters on the CPU. Faster in most games. = Animuje postacie na CPU. Szybsze w większości gier.
Rechecks textures less often. Faster, and wrong in a few games. = Rzadziej sprawdza tekstury. Szybciej, a w kilku grach błędnie.
Much faster, and drops the effects some games draw off-screen. = Znacznie szybsze, ale usuwa efekty rysowane poza ekranem.
The home screen's own sounds. A game's music is separate. = Dźwięki ekranu głównego. Muzyka gry jest osobno.
What a game is told the console's language is, and PPSSPP's own text. = Język zgłaszany grze oraz własny tekst PPSSPP.
How fast the game runs while the right trigger is held. = Jak szybko działa gra, gdy prawy spust jest wciśnięty.
On earns hardcore unlocks but turns off save states entirely. = Włączone daje osiągnięcia hardcore, ale całkiem wyłącza zapisy stanu.
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = Używa paczki z PSP/TEXTURES/<GAMEID>/, jeśli gra ją ma.
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = Zapisuje to, co rysuje gra, do PSP/TEXTURES/<GAMEID>/new/, by zbudować paczkę.
