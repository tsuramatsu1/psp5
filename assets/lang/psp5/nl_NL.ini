Crop to 16:9 = Bijsnijden naar 16:9
How much sharper than a PSP the picture is drawn. = Hoeveel scherper dan een PSP het beeld wordt getekend.
Nearest keeps the original pixels; linear smooths them. = Dichtstbijzijnde behoudt de oorspronkelijke pixels, lineair maakt ze glad.
Draws the frame rate over the game. = Tekent de beeldsnelheid over het spel.
Audio from the emulator. = Geluid van de emulator.
0 to 100, in steps of five. = 0 tot 100, in stappen van vijf.
Which button on the controller the PSP's is on. = Op welke knop van de controller die van de PSP zit.
Puts all eight back where they started. = Zet alle acht terug waar ze begonnen.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = Controllers die de console niet koppelt: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = Geen USB-controller gevonden. Een DualSense heeft hier niets nodig.
Sharpens textures seen at a steep angle, like roads and floors. = Verscherpt texturen onder een scherpe hoek, zoals wegen en vloeren.
Redraws the game's textures larger, on the CPU. Costly. = Tekent de texturen groter op de CPU. Kostbaar.
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ houdt randen scherp, bicubisch is zachter en goedkoper.
Smooths the banding upscaling can leave in a gradient. = Vlakt de banden glad die opschalen in een verloop achterlaat.
Softens jagged edges. Off when buffer effects are skipped. = Verzacht gekartelde randen. Uit als buffereffecten worden overgeslagen.
Leaves flat 2D art alone so menus and text stay sharp. = Laat platte 2D-beelden ongemoeid zodat menu's en tekst scherp blijven.
Trims a sliver off the top and bottom to fill a widescreen. = Snijdt boven en onder een strookje af om breedbeeld te vullen.
On removes tearing; off lets frames arrive as soon as they are drawn. = Aan voorkomt tearing, uit levert beelden zodra ze getekend zijn.
Drops frames to keep a heavy game at speed. Off looks best. = Slaat beelden over om een zwaar spel op snelheid te houden. Uit oogt het best.
Transforms geometry on the GPU. Off is slower and more accurate. = Transformeert geometrie op de GPU. Uit is langzamer en nauwkeuriger.
Animates characters on the CPU. Faster in most games. = Animeert personages op de CPU. In de meeste spellen sneller.
Rechecks textures less often. Faster, and wrong in a few games. = Controleert texturen minder vaak. Sneller, en fout in enkele spellen.
Much faster, and drops the effects some games draw off-screen. = Veel sneller, maar laat effecten vallen die sommige spellen buiten beeld tekenen.
The home screen's own sounds. A game's music is separate. = De geluiden van het startscherm. De muziek van een spel staat los.
What a game is told the console's language is, and PPSSPP's own text. = De taal die aan een spel wordt doorgegeven, en PPSSPP's eigen tekst.
How fast the game runs while the right trigger is held. = Hoe snel het spel loopt terwijl de rechtertrigger ingedrukt blijft.
On earns hardcore unlocks but turns off save states entirely. = Aan levert hardcore-prestaties op maar schakelt savestates volledig uit.
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = Gebruikt een pakket uit PSP/TEXTURES/<GAMEID>/ als een spel er een heeft.
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = Schrijft wat een spel tekent naar PSP/TEXTURES/<GAMEID>/new/ om een pakket te maken.
