# psp5's own words in Chinese (Traditional).
#
# MACHINE TRANSLATED AND, FOR MOST LANGUAGES, UNREVIEWED. See the note in
# tools/make-strings.py. Corrections are welcome: edit this file or the table
# in that script, and the next build picks them up.
#
# `English = translation`, one per line. A missing line falls back to English.

Favorites = 收藏
Favorite = 收藏
Added = 加入於
Not played yet = 尚未遊玩
Import from cheat.db = 從 cheat.db 匯入
No cheat file for this game = 此遊戲沒有金手指檔案
Slot = 存檔位
Save to this slot = 儲存至此存檔位
Load from this slot = 從此存檔位讀取
Exit game = 離開遊戲
empty = 空
Change = 變更
Close = 關閉
Toggle = 切換
Save and close = 儲存並關閉
Reset the buttons = 重設按鍵
USB controllers = USB 控制器
Changed = 已變更
Default = 預設
Crop to 16:9 = 裁切為 16:9
How much sharper than a PSP the picture is drawn. = 畫面比 PSP 清晰多少。
Nearest keeps the original pixels; linear smooths them. = 鄰近保留原始像素，線性則將其平滑。
Draws the frame rate over the game. = 在遊戲畫面上繪製影格率。
Audio from the emulator. = 來自模擬器的聲音。
0 to 100, in steps of five. = 0 到 100，每次 5。
Which button on the controller the PSP's is on. = PSP 的按鍵對應控制器上的哪個鍵。
Puts all eight back where they started. = 將八個按鍵全部恢復原位。
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = 主機不會配對的控制器：Xbox 360、PS3、DualShock 3。
No USB controller found. A DualSense needs nothing here. = 未找到 USB 控制器。DualSense 無需在此設定。
Sharpens textures seen at a steep angle, like roads and floors. = 銳利化以斜角看到的紋理，例如道路和地面。
Redraws the game's textures larger, on the CPU. Costly. = 在 CPU 上將紋理重繪得更大。開銷較高。
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ 保持邊緣銳利；雙三次更柔和也更省。
Smooths the banding upscaling can leave in a gradient. = 平滑放大在漸層中留下的色帶。
Softens jagged edges. Off when buffer effects are skipped. = 柔化鋸齒邊緣。略過緩衝特效時無效。
Leaves flat 2D art alone so menus and text stay sharp. = 保留平面 2D 影像，使選單和文字保持清晰。
Trims a sliver off the top and bottom to fill a widescreen. = 裁去上下少許以填滿寬螢幕。
On removes tearing; off lets frames arrive as soon as they are drawn. = 開啟可消除撕裂；關閉則畫面繪製完即刻輸出。
Drops frames to keep a heavy game at speed. Off looks best. = 捨棄影格以維持重負載遊戲的速度。關閉時畫面最好。
Transforms geometry on the GPU. Off is slower and more accurate. = 在 GPU 上轉換幾何體。關閉較慢但更準確。
Animates characters on the CPU. Faster in most games. = 在 CPU 上處理角色動畫。多數遊戲更快。
Rechecks textures less often. Faster, and wrong in a few games. = 較少重新檢查紋理。更快，但少數遊戲會出錯。
Much faster, and drops the effects some games draw off-screen. = 快得多，但會遺失部分遊戲在畫面外繪製的特效。
The home screen's own sounds. A game's music is separate. = 主畫面自身的音效。遊戲音樂與此無關。
What a game is told the console's language is, and PPSSPP's own text. = 告知遊戲的主機語言，以及 PPSSPP 自身的文字。
How fast the game runs while the right trigger is held. = 按住右扳機時遊戲的執行速度。
On earns hardcore unlocks but turns off save states entirely. = 開啟可獲得硬派成就，但會完全關閉即時存檔。
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = 若遊戲有，則使用 PSP/TEXTURES/<GAMEID>/ 中的材質包。
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = 將遊戲繪製的內容寫入 PSP/TEXTURES/<GAMEID>/new/ 以製作材質包。
