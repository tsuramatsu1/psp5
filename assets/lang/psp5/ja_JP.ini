USB controllers = USB コントローラー
Changed = 変更済み
Default = 初期設定
Crop to 16:9 = 16:9 に切り抜く
How much sharper than a PSP the picture is drawn. = PSP よりどれだけ高精細に描画するか。
Nearest keeps the original pixels; linear smooths them. = ニアレストは元のピクセルを残し、リニアは滑らかにします。
Draws the frame rate over the game. = フレームレートをゲームの上に表示します。
Audio from the emulator. = エミュレーターの音声。
0 to 100, in steps of five. = 0 から 100 まで、5 刻み。
Which button on the controller the PSP's is on. = PSP のボタンをコントローラーのどのボタンに割り当てるか。
Puts all eight back where they started. = 8 つすべてを元の位置に戻します。
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = 本体がペアリングしないコントローラー: Xbox 360、PS3、DualShock 3。
No USB controller found. A DualSense needs nothing here. = USB コントローラーが見つかりません。DualSense はここでは不要です。
Sharpens textures seen at a steep angle, like roads and floors. = 道や床のような浅い角度のテクスチャを鮮明にします。
Redraws the game's textures larger, on the CPU. Costly. = CPU でテクスチャを拡大して描き直します。負荷は高めです。
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ は輪郭を保ち、バイキュービックは柔らかく軽量です。
Smooths the banding upscaling can leave in a gradient. = 拡大時にグラデーションへ出る縞を滑らかにします。
Softens jagged edges. Off when buffer effects are skipped. = ギザギザの輪郭を滑らかにします。バッファ効果を省くと無効です。
Leaves flat 2D art alone so menus and text stay sharp. = 平面の 2D 画像はそのままにし、メニューや文字を鮮明に保ちます。
Trims a sliver off the top and bottom to fill a widescreen. = 上下をわずかに切り落として横長画面いっぱいに表示します。
On removes tearing; off lets frames arrive as soon as they are drawn. = オンでティアリングを防ぎ、オフでは描画でき次第フレームを出します。
Drops frames to keep a heavy game at speed. Off looks best. = 重いゲームの速度を保つためフレームを省きます。オフが最もきれいです。
Transforms geometry on the GPU. Off is slower and more accurate. = ジオメトリを GPU で変換します。オフは低速ですが正確です。
Animates characters on the CPU. Faster in most games. = キャラクターを CPU でアニメーションさせます。多くのゲームで高速です。
Rechecks textures less often. Faster, and wrong in a few games. = テクスチャの再確認を減らします。高速ですが一部のゲームで乱れます。
Much faster, and drops the effects some games draw off-screen. = 大幅に高速ですが、画面外に描く効果が失われるゲームがあります。
The home screen's own sounds. A game's music is separate. = ホーム画面自体の効果音です。ゲームの音楽とは別です。
What a game is told the console's language is, and PPSSPP's own text. = ゲームに伝える本体の言語と、PPSSPP 自身の文字です。
How fast the game runs while the right trigger is held. = 右トリガーを押している間のゲーム速度です。
On earns hardcore unlocks but turns off save states entirely. = オンでハードコア実績を獲得できますが、ステートセーブは一切使えません。
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = ゲームに用意があれば PSP/TEXTURES/<GAMEID>/ のパックを使います。
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = ゲームが描いた内容を PSP/TEXTURES/<GAMEID>/new/ に書き出してパックを作ります。
