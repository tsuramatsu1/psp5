How much sharper than a PSP the picture is drawn. = Quanto mais nítida que uma PSP a imagem é desenhada.
Nearest keeps the original pixels; linear smooths them. = Vizinho mantém os pixéis originais; linear suaviza-os.
Draws the frame rate over the game. = Desenha a taxa de fotogramas sobre o jogo.
Audio from the emulator. = Áudio do emulador.
0 to 100, in steps of five. = De 0 a 100, em passos de cinco.
Which button on the controller the PSP's is on. = Em que botão do comando está o da PSP.
Puts all eight back where they started. = Coloca os oito de volta onde começaram.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = Comandos que a consola não emparelha: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = Nenhum comando USB encontrado. Um DualSense não precisa de nada aqui.
Sharpens textures seen at a steep angle, like roads and floors. = Torna nítidas texturas vistas de lado, como estradas e pisos.
Redraws the game's textures larger, on the CPU. Costly. = Redesenha as texturas maiores, na CPU. Dispendioso.
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ mantém as arestas nítidas; bicúbico é mais suave e barato.
Smooths the banding upscaling can leave in a gradient. = Suaviza as faixas que a ampliação deixa num gradiente.
Softens jagged edges. Off when buffer effects are skipped. = Suaviza arestas serrilhadas. Desligado se os efeitos de buffer forem ignorados.
Leaves flat 2D art alone so menus and text stay sharp. = Deixa a arte 2D intacta para menus e texto ficarem nítidos.
Trims a sliver off the top and bottom to fill a widescreen. = Corta uma faixa em cima e em baixo para preencher o ecrã panorâmico.
On removes tearing; off lets frames arrive as soon as they are drawn. = Ligado elimina o rasgo; desligado entrega os fotogramas assim que desenhados.
Drops frames to keep a heavy game at speed. Off looks best. = Descarta fotogramas para manter a velocidade. Desligado fica melhor.
Transforms geometry on the GPU. Off is slower and more accurate. = Transforma a geometria na GPU. Desligado é mais lento e mais preciso.
Animates characters on the CPU. Faster in most games. = Anima as personagens na CPU. Mais rápido na maioria dos jogos.
Rechecks textures less often. Faster, and wrong in a few games. = Reverifica as texturas com menos frequência. Mais rápido, e errado em alguns jogos.
Much faster, and drops the effects some games draw off-screen. = Bem mais rápido, e perde os efeitos que alguns jogos desenham fora do ecrã.
The home screen's own sounds. A game's music is separate. = Os sons do ecrã inicial. A música do jogo é separada.
What a game is told the console's language is, and PPSSPP's own text. = O idioma comunicado ao jogo e o texto do próprio PPSSPP.
How fast the game runs while the right trigger is held. = A velocidade do jogo enquanto o gatilho direito fica premido.
On earns hardcore unlocks but turns off save states entirely. = Ligado concede proezas hardcore, mas desativa por completo os estados guardados.
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = Usa um pacote de PSP/TEXTURES/<GAMEID>/ quando o jogo tem um.
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = Grava o que o jogo desenha em PSP/TEXTURES/<GAMEID>/new/ para criar um pacote.
