Press Triangle on a game to keep it here. = 게임에서 세모 버튼을 누르면 여기에 남습니다.
Closes PSP5 and returns to the console. = PSP5를 닫고 본체로 돌아갑니다.
Signs in so games award achievements as you play. = 로그인하면 플레이 중에 게임이 업적을 부여합니다.
Keeps a separate set of settings for this game. = 이 게임만의 설정을 따로 보관합니다.
Not signed in = 로그인하지 않음
Buttons = 버튼
CONTROLS = 조작
BUTTON = 버튼
SECOND BUTTON = 두 번째 버튼
Set = 설정
Second button = 두 번째 버튼
Clear the second = 두 번째 지우기
Not set = 설정 안 됨
Which console button each of the PSP's is on. = PSP의 각 버튼이 본체의 어느 버튼에 있는지.
Puts all twelve back where they started. = 열두 개 모두를 원래 자리로 되돌립니다.
Press the console button you want it on. Waiting = 원하는 본체 버튼을 누르세요. 대기
Search = 검색
