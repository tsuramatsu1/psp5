# psp5's own words in Korean.
#
# MACHINE TRANSLATED AND, FOR MOST LANGUAGES, UNREVIEWED. See the note in
# tools/make-strings.py. Corrections are welcome: edit this file or the table
# in that script, and the next build picks them up.
#
# `English = translation`, one per line. A missing line falls back to English.

Favorites = 즐겨찾기
Favorite = 즐겨찾기
A-Z = 가나다순
Added = 추가일
Not played yet = 플레이한 적 없음
Import from cheat.db = cheat.db에서 가져오기
No cheat file for this game = 이 게임의 치트 파일이 없습니다
Slot = 슬롯
Save to this slot = 이 슬롯에 저장
Load from this slot = 이 슬롯에서 불러오기
Exit game = 게임 종료
empty = 비어 있음
Change = 변경
Close = 닫기
Toggle = 전환
Save and close = 저장하고 닫기
Reset the buttons = 버튼 초기화
USB controllers = USB 컨트롤러
Changed = 변경됨
Default = 기본값
Crop to 16:9 = 16:9으로 자르기
How much sharper than a PSP the picture is drawn. = PSP보다 얼마나 선명하게 그릴지.
Nearest keeps the original pixels; linear smooths them. = 최근접은 원래 픽셀을 유지하고, 선형은 부드럽게 만듭니다.
Draws the frame rate over the game. = 게임 위에 프레임 속도를 표시합니다.
Audio from the emulator. = 에뮬레이터의 소리입니다.
0 to 100, in steps of five. = 0에서 100까지, 5 단위입니다.
Which button on the controller the PSP's is on. = PSP 버튼이 컨트롤러의 어느 버튼에 있는지.
Puts all eight back where they started. = 여덟 개 모두를 원래 자리로 되돌립니다.
Controllers the console will not pair: Xbox 360, PS3, DualShock 3. = 본체가 페어링하지 않는 컨트롤러: Xbox 360, PS3, DualShock 3.
No USB controller found. A DualSense needs nothing here. = USB 컨트롤러를 찾지 못했습니다. DualSense는 여기서 필요 없습니다.
Sharpens textures seen at a steep angle, like roads and floors. = 도로나 바닥처럼 비스듬히 보이는 텍스처를 선명하게 합니다.
Redraws the game's textures larger, on the CPU. Costly. = CPU에서 텍스처를 더 크게 다시 그립니다. 부담이 큽니다.
xBRZ keeps edges crisp; bicubic is softer and cheaper. = xBRZ는 가장자리를 또렷하게, 바이큐빅은 부드럽고 가볍습니다.
Smooths the banding upscaling can leave in a gradient. = 확대 시 그라데이션에 생기는 띠를 부드럽게 합니다.
Softens jagged edges. Off when buffer effects are skipped. = 계단 현상을 부드럽게 합니다. 버퍼 효과를 건너뛰면 꺼집니다.
Leaves flat 2D art alone so menus and text stay sharp. = 평면 2D 그림은 그대로 두어 메뉴와 글자를 또렷하게 유지합니다.
Trims a sliver off the top and bottom to fill a widescreen. = 위아래를 조금 잘라내 와이드 화면을 채웁니다.
On removes tearing; off lets frames arrive as soon as they are drawn. = 켜면 테어링이 사라지고, 끄면 그려지는 즉시 프레임을 내보냅니다.
Drops frames to keep a heavy game at speed. Off looks best. = 무거운 게임의 속도를 위해 프레임을 건너뜁니다. 끄면 가장 보기 좋습니다.
Transforms geometry on the GPU. Off is slower and more accurate. = 지오메트리를 GPU에서 변환합니다. 끄면 느리지만 더 정확합니다.
Animates characters on the CPU. Faster in most games. = 캐릭터를 CPU에서 애니메이션합니다. 대부분의 게임에서 더 빠릅니다.
Rechecks textures less often. Faster, and wrong in a few games. = 텍스처를 덜 자주 다시 확인합니다. 빠르지만 일부 게임에서 어긋납니다.
Much faster, and drops the effects some games draw off-screen. = 훨씬 빠르지만 일부 게임이 화면 밖에 그리는 효과가 사라집니다.
The home screen's own sounds. A game's music is separate. = 홈 화면 자체의 소리입니다. 게임 음악과는 별개입니다.
What a game is told the console's language is, and PPSSPP's own text. = 게임에 알려 주는 본체 언어와 PPSSPP 자체 문구입니다.
How fast the game runs while the right trigger is held. = 오른쪽 트리거를 누르고 있는 동안의 게임 속도입니다.
On earns hardcore unlocks but turns off save states entirely. = 켜면 하드코어 업적을 얻지만 상태 저장이 완전히 꺼집니다.
Uses a pack from PSP/TEXTURES/<GAMEID>/ when a game has one. = 게임에 있으면 PSP/TEXTURES/<GAMEID>/의 팩을 사용합니다.
Writes what a game draws to PSP/TEXTURES/<GAMEID>/new/, to build a pack. = 게임이 그린 것을 PSP/TEXTURES/<GAMEID>/new/에 기록해 팩을 만듭니다.
MENU = 메뉴
